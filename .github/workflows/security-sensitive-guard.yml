name: Security Sensitive Guard

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reevaluate with the policy on the selected branch (use main)
        required: true
        type: string
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks trusted base script only; never checks out PR head
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

concurrency:
  # Skipped runs must not replace a pending approval or revocation evaluation.
  group: >-
    security-sensitive-guard-${{ (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
    (github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
    (github.event.action != 'created' || contains(github.event.comment.body, '/allow-security-sensitive-change')))) &&
    (github.event.pull_request.number || github.event.issue.number || inputs.pr_number) || format('ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  security-sensitive-guard:
    if: >-
      ${{ (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request &&
      (github.event.action != 'created' || contains(github.event.comment.body, '/allow-security-sensitive-change')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup trusted policy runtime
        uses: ./.github/actions/setup-security-review

      - name: Review security-sensitive changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/security-sensitive-guard.mjs
