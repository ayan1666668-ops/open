name: Security Sensitive Guard

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reevaluate with the policy on the selected branch (use main)
        required: true
        type: string
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks trusted base script only; never checks out PR head
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run: # zizmor: ignore[dangerous-triggers] reads live PR metadata only; no signal artifacts or code
    workflows: [Security review events]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

concurrency:
  group: security-sensitive-guard-${{ github.event.pull_request.number && format('PR {0}', github.event.pull_request.number) || github.event.workflow_run.display_title || format('PR {0}', inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  security-sensitive-guard:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Review security-sensitive changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/security-sensitive-guard.mjs
