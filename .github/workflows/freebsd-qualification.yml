name: FreeBSD Gateway Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/freebsd-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build package candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          cache-mode: off

      - name: Build the package from this checkout
        run: |
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog \
            --output-dir .artifacts/freebsd-candidate \
            --output-name openclaw.tgz
          git rev-parse HEAD > .artifacts/freebsd-candidate/source-sha
          cd .artifacts/freebsd-candidate
          sha256sum openclaw.tgz > SHA256SUMS

      - name: Upload package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/freebsd-candidate/
          retention-days: 7
          if-no-files-found: error

  gateway:
    name: FreeBSD package and gateway
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: freebsd-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/freebsd-candidate

      - name: Verify candidate source
        run: test "$(cat .artifacts/freebsd-candidate/source-sha)" = "$(git rev-parse HEAD)"

      # This action provisions a disposable VM and modifies its Ubuntu host.
      # Keep it on a fresh GitHub-hosted runner, with no reusable machine state.
      - name: Install package and run gateway on FreeBSD
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: x86_64
          sync: rsync
          disable-cache: true
          debug-on-error: false
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            printf '%s\n' 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            # node-gyp uses Python and GNU make for native addon builds on BSD.
            pkg install -y node24 npm-node24 git python3 gmake
            python3 --version
            gmake --version
            cc --version
            c++ --version
          run: |
            set -eu
            uname -a
            node --version
            npm --version
            cat .artifacts/freebsd-candidate/source-sha
            expected=$(awk '{print $1}' .artifacts/freebsd-candidate/SHA256SUMS)
            test "$(sha256 -q .artifacts/freebsd-candidate/openclaw.tgz)" = "$expected"
            qualification_root=$(mktemp -d)
            export HOME="$qualification_root/home"
            export OPENCLAW_STATE_DIR="$qualification_root/state"
            mkdir -p "$HOME"
            npm install --engine-strict --prefix "$qualification_root/install" \
              "$PWD/.artifacts/freebsd-candidate/openclaw.tgz"
            cli="$qualification_root/install/node_modules/.bin/openclaw"
            "$cli" --version
            "$cli" gateway --allow-unconfigured --bind loopback --port 18789 \
              > "$qualification_root/gateway.log" 2>&1 &
            gateway_pid=$!
            trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true; cat "$qualification_root/gateway.log"' EXIT HUP INT TERM
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { setTimeout } from 'node:timers/promises';
            const deadline = Date.now() + 90_000;
            for (;;) {
              try {
                for (const path of ['healthz', 'readyz']) {
                  const response = await fetch(`http://127.0.0.1:18789/${path}`, {
                    signal: AbortSignal.timeout(2_000),
                  });
                  assert.equal(response.status, 200);
                  const body = await response.json();
                  if (path === 'healthz') {
                    assert.equal(body.ok, true);
                    assert.equal(body.status, 'live');
                  } else {
                    assert.equal(body.ready, true);
                  }
                }
                console.log('FreeBSD gateway is live and ready');
                break;
              } catch (error) {
                if (Date.now() >= deadline) throw error;
                await setTimeout(1_000);
              }
            }
            NODE
            kill -TERM "$gateway_pid"
            wait "$gateway_pid"
            trap - EXIT HUP INT TERM
            cat "$qualification_root/gateway.log"
