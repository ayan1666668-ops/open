# Temporary diagnostic only; remove before landing any source change.
name: Temporary Windows worker compiler diagnostic

on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
    paths: [.github/workflows/windows-worker-compiler-diagnostic.yml]

permissions:
  contents: read

concurrency:
  group: windows-worker-compiler-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  BASE_SHA: b4f6bb9bfa617fba6f9052ff2fda0ce384b9b00c
  BASE_TREE: 3ca9c60a5524ad5daace4cb41d33b0c5c60ac30d
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  WORKFLOW_SHA: ${{ github.workflow_sha }}
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_TEST_SKIP_FULL_EXTENSIONS_SHARD: "1"

jobs:
  diagnostic:
    if: github.repository == 'openclaw/openclaw' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.state == 'open' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' && github.event.pull_request.base.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.repo.full_name == 'openclaw/openclaw' && github.event.pull_request.head.ref == 'test/windows-worker-compiler-diagnostics' && github.event.pull_request.user.login == 'vincentkoc'
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind the diagnostic to the tested source cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$(printf '%s\n' .github/workflows/windows-worker-compiler-diagnostic.yml test/scripts/vitest-worker-artifacts.transforms.test.ts)"
          test -z "$(git status --porcelain)"
          git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --no-write-fetch-head origin "$WORKFLOW_SHA"
          test "$(git rev-parse "$SOURCE_SHA:.github/workflows/windows-worker-compiler-diagnostic.yml")" = "$(git rev-parse "$WORKFLOW_SHA:.github/workflows/windows-worker-compiler-diagnostic.yml")"
          printf 'Diagnostic source %s tree %s; tested base %s; workflow %s\n' "$SOURCE_SHA" "$(git rev-parse HEAD^{tree})" "$BASE_SHA" "$WORKFLOW_SHA"

      # Keep the ordinary Windows job's existing best-effort setup behavior.
      - name: Try to exclude workspace from Windows Defender (best-effort)
        shell: pwsh
        run: |
          $cmd = Get-Command Add-MpPreference -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "Add-MpPreference not available, skipping Defender exclusions."
            exit 0
          }
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionProcess "node.exe" -ErrorAction Stop
            Write-Host "Defender exclusions applied."
          } catch {
            Write-Warning "Failed to apply Defender exclusions, continuing. $($_.Exception.Message)"
          }

      - name: Select the original Node version
        run: |
          set -euo pipefail
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node 24.19.0

      - name: Setup pnpm through the canonical Windows owner
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: "24.19.0"
          cache-mode: "off"

      - name: Install the unchanged frozen dependency cohort once
        env:
          CI: "true"
        run: |
          set -euo pipefail
          node -e 'if(process.versions.node !== "24.19.0") throw new Error("Unexpected Node version")'
          pnpm -v
          pnpm install --frozen-lockfile --prefer-offline --config.ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true --config.side-effects-cache=true
          git diff --exit-code

      - name: Run the unchanged transforms sequence once with failure context
        env:
          OPENCLAW_VITEST_MAX_WORKERS: "4"
          OPENCLAW_TEST_PROJECTS_PARALLEL: "1"
        run: |
          set -euo pipefail
          node --input-type=module <<'DIAGNOSTIC'
          import assert from 'node:assert/strict';
          import { spawnSync, execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, 'x64');
          assert.equal(process.versions.node, '24.19.0');
          const file = 'test/scripts/vitest-worker-artifacts.transforms.test.ts';
          const output = path.resolve('proof/transforms.json');
          fs.mkdirSync('proof', { recursive: true });
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const args = ['--import', './scripts/tsx.mjs', 'scripts/test-projects.mts', file,
            '--fileParallelism', '--reporter=default', '--reporter=json', `--outputFile=${output}`];
          const receipt = {
            source: process.env.SOURCE_SHA, tree: git('rev-parse', 'HEAD^{tree}'),
            base: process.env.BASE_SHA, workflow: process.env.WORKFLOW_SHA,
            run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            runtime: { executable: path.basename(process.execPath), sha256: hash(fs.readFileSync(process.execPath)),
              node: process.versions.node, uv: process.versions.uv, arch: process.arch },
            inputs: Object.fromEntries(['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', file]
              .map(name => [name, git('rev-parse', `HEAD:${name}`)])),
            command: ['node', ...args.slice(0, -1), '--outputFile=proof/transforms.json'],
            completed: false,
          };
          fs.writeFileSync('proof/command.json', JSON.stringify(receipt, null, 2));
          const started = process.hrtime.bigint();
          const result = spawnSync(process.execPath, args, { stdio: 'inherit' });
          Object.assign(receipt, { completed: true, status: result.status, signal: result.signal,
            errorCode: result.error?.code ?? null, wallMs: Number(process.hrtime.bigint() - started) / 1e6 });
          fs.writeFileSync('proof/command.json', JSON.stringify(receipt, null, 2));
          console.log(JSON.stringify(receipt));
          if (result.error || result.status !== 0) process.exit(result.status || 1);
          const report = JSON.parse(fs.readFileSync(output, 'utf8'));
          assert.equal(report.success, true);
          for (const key of ['numFailedTests', 'numPendingTests', 'numTodoTests', 'numFailedTestSuites', 'numPendingTestSuites']) assert.equal(report[key], 0, key);
          assert.equal(report.numTotalTests, 3);
          assert.equal(report.numPassedTests, 3);
          assert.equal(report.testResults.length, 1);
          assert.equal(path.resolve(report.testResults[0].name), path.resolve(file));
          assert.equal(report.testResults[0].assertionResults.length, 3);
          for (const test of report.testResults[0].assertionResults) assert.equal(test.status, 'passed');
          git('diff', '--exit-code');
          console.log('Three original transforms cases passed; a passing run does not establish a crash fix.');
          DIAGNOSTIC

      - name: Retain the bounded native report and command receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-worker-compiler-${{ github.run_id }}-${{ github.run_attempt }}
          path: proof/
          if-no-files-found: warn
          retention-days: 7
