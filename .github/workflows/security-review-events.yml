name: Security review events
run-name: PR ${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Fork review events have no write token. A trusted workflow_run handler
      # rereads the PR and reviews; it consumes no code or artifacts from this job.
      - run: echo 'Reevaluate maintainer security review'
