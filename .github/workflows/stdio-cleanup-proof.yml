name: Temporary stdio Windows proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/stdio-cleanup-proof.yml
      - src/process/owned-stdio.ts
      - src/process/supervisor/service-child-relay-host.ts
      - src/process/supervisor/service-child-relay-host.test.ts
      - src/process/supervisor/adapters/child.ts
      - src/process/supervisor/adapters/child.test.ts
      - src/process/supervisor/adapters/child.test-support.ts
      - src/agents/mcp-stdio-transport.test.ts
      - src/agents/mcp-stdio-transport.windows.test.ts

permissions:
  contents: read

concurrency:
  group: stdio-cleanup-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192
  SOURCE_PINS: '{"package.json":"2eff013c5971df482a4a1299158e36014d856364b279559695f7ed956b9e4754","pnpm-lock.yaml":"a6a6f2aecc88c5a04c7f268a2ffbbc998deead2567e7161773f753b7ca4370c2","src/agents/mcp-stdio-transport.test.ts":"77a2ffe0c413d2fd7f8aee85ff6e98e293daa360de278889dee09825ba865b34","src/agents/mcp-stdio-transport.ts":"04bbbcb039294fc46fb8c6bdaf060fa85ead0baf7aef4859d37040bb3b0925e9","src/agents/mcp-stdio-transport.windows.test.ts":"ebe0c6e53a1e0a2bb1b3bc69f473549291fb2d39af89854cb2c89f14c70ed036","src/infra/update-managed-service-handoff-boundary.test-support.ts":"572eb79de59417262082dc0c04659440a1e87677a2c70b296eb8135c6e0bd605","src/infra/update-managed-service-handoff-state.test-support.ts":"4eee7aeda11cf20fb0a6fe5c9dcd710faa92b0d4e9b694e9e6adc468b37dfcf7","src/process/owned-stdio.test.ts":"7dd474b8af4395ceea9646dacb16c33096cfe82f672f4ea527e54da7ded6bac6","src/process/owned-stdio.ts":"63c3c54493e28b6f52395c810030cbeb6e26b4b5e844486dcaf1e56314be0aa1","src/process/supervisor/adapters/child.service-lifecycle.test.ts":"487447c7439059d02ebbbb32f776f4e219e204d8aafb3f279a12129de642f13c","src/process/supervisor/adapters/child.test-support.ts":"1d321a9dcd4b062268e1530dacdaf22c93732e94b43f29e4641d62f4513e5373","src/process/supervisor/adapters/child.test.ts":"cc800c33c55cf8836418bee388eca4ad545818adc52e385165295a8552c255dd","src/process/supervisor/adapters/child.ts":"d25f539863a9c78cecdb45c597fb6385b1e85cf790004b788666a553a9b70b64","src/process/supervisor/service-child-relay-host.test.ts":"71696fa612c2aa004d80dfc379de633f903a3ab298ee5b0af620f1e6e927521f","src/process/supervisor/service-child-relay-host.ts":"5eb61a5debfc0340b930ace9762ef36b00da87ba1b6ddbb2e41d724d9579e163","src/process/supervisor/supervisor.ts":"7311873f0e1d9ee146649b8a6ff13833eae7da2423688bd0dbfec4cc6f8b9b57","src/process/supervisor/types.ts":"891f5b4c551827745df34c1d4b3943f63d901d9b3330ec8fc6ea817526c3a74a"}'

jobs:
  windows-owner:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/stdio-cleanup-completion'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCLAW_VITEST_MAX_WORKERS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT: 2dc64beaba3a8bcd368105663ed43267f4ab69a7
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/stdio-cleanup-proof.yml"
          git merge-base --is-ancestor 1611ca6d16a91c98037fb21e9ba49e0d5b9f2731 HEAD
          git show --no-patch --format='%H %P'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            assert.equal(actual, expected, file);
            console.log(`${actual}  ${file}`);
          }
          NODE
      - name: Setup frozen Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.19.0"
          install-bun: "false"
          cache-mode: "off"
      - name: Verify native Windows and run direct-child contract
        run: |
          node -e 'if(process.platform!=="win32")process.exit(1); console.log(JSON.stringify({platform:process.platform,node:process.version,arch:process.arch}))'
          pnpm -v
          node scripts/run-vitest.mjs src/process/supervisor/adapters/child.test.ts src/process/owned-stdio.test.ts src/agents/mcp-stdio-transport.windows.test.ts
      - name: Final source verification
        if: always()
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PARENT: 2dc64beaba3a8bcd368105663ed43267f4ab69a7
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/stdio-cleanup-proof.yml"
          git merge-base --is-ancestor 1611ca6d16a91c98037fb21e9ba49e0d5b9f2731 HEAD
          git show --no-patch --format='%H %P'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const [file, expected] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            const actual = createHash('sha256').update(readFileSync(file)).digest('hex');
            assert.equal(actual, expected, file);
            console.log(`${actual}  ${file}`);
          }
          NODE
