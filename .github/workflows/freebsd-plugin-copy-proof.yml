# Temporary qualification for PR 154354; remove before landing.
name: Temporary plugin copy proof

on:
  push:
    branches: [fix/freebsd-plugin-snapshot-copy]

permissions:
  contents: read

concurrency:
  group: freebsd-plugin-copy-154354
  cancel-in-progress: false

env:
  SOURCE_SHA: 85038d22637e4ad00c9311529a37ce9189f346f0
  SOURCE_TREE: 11b66e81fb37e80784f7b8228586dcfc1530fe46
  BASE_SHA: 6bb897a7231a3cb681186b0645a9c1cdd1dcf3b3
  HARNESS_SHA: ${{ github.sha }}
  SOURCE_PINS: '{"package.json":"6c4394cc9de73b833136f4aa8857d2dd164a9a57a86832e0eb0939e6770c2480","pnpm-lock.yaml":"1f8a8e068df19803f7492454c7c6283a6630a0cf05417044d81b24c1cd5a188a","pnpm-workspace.yaml":"edced18940dc8b3c31210b327561fca062ce6cebebe92893be983ed604f64ee8",".npmrc":"f1d021e2abdf8817d83e35feb1f5d604e8c985aa0553bec3d417cf6f93e9c09c","packages/ai/package.json":"61eefcb38095a41de445f781c738cb1f89c960ddf6c56f39c6d61970d8db277b","packages/markdown-core/package.json":"eb934f4829a87292edff90480e2c060e636afdd75d35a3ffc02a55581e37a548","packages/model-catalog-core/package.json":"0cef9224746d0eed66278f729b6edf4d6e7cdf31fd35b16af62bae0aa4635331","packages/normalization-core/package.json":"2bfc2ae79211db8023b168e8dd6c5f378dd64e0890b32ae9a043d38c867683a5","packages/session-url-contract/package.json":"ce05f27abdafc0ff033aadf0d0944f8c48681d5eebcd5dec7485e64215abe827","src/infra/update-candidate-plugin-tree.ts":"060022e39079e54588f263364c37145115d514dfc108ca67f9443a438027822b","src/infra/update-candidate-plugin-tree.test.ts":"a376e1960015e6dbe5085dbecda766918eab5f78c14dca004d1c73a54dafec89","src/infra/update-candidate-plugin-repair.ts":"2e23d5e676d91d486a145236d0a36804efe9c81e59e64b7e2267a296d06ad114","src/infra/update-candidate-plugin-repair.test.ts":"a4b751210bba8d9f8ca91c40536e0bef06c30b1f67a25a740469b8fbe4ee5256","src/infra/update-candidate-plugin-sources.test.ts":"6ef2ff6ecf1e43d1373f2b895fda6bdcd24527fcbdaf52379cdc1900e808f574","src/infra/update-candidate-state.inventory.test.ts":"9c0c618be0168ae91c88cd6cef3f019e2f6bf7be3ea9e37099dfc0bef38e7984","src/infra/update-candidate-state.cleanup.test.ts":"56cb92f80680c90e0b004899fda92e68a3e45786e89d69d63c8c45adaf912d43","src/infra/update-candidate-snapshot.ts":"a36fbba2f5925599498821f1704e2154cab9050001e3d831fe1b7ac6ece43614","src/infra/update-candidate-state.ts":"3bd94c4d798769e28176071df5a583b18a2deef8b64c23b16ac3d36c861ced9e","src/infra/update-candidate-state.worker.ts":"98528b867ad9ba6afd731b347cbe0b9d37c364c9e51a29a673ea1b57e9fbee08","src/infra/update-candidate-plugins.ts":"da960f5b2465dfa286dc40be8d42fbc83800fea6143b66d19f28d25376eb7092","src/process/exec-runner.ts":"db5c44d06696bdb97e58636290a81da2081bf82be7c5e260a28f9984a10f7f43","src/process/exec-result.ts":"8bcacfd0b9fa8c69c5e659d7076b111ec83ac7fd2885ade9204e85e0c69ce7f8","src/process/exec-termination.ts":"f2d789806f347701d73fddff08eb196df4911138fdc4bd48de256b5337b5a13c","scripts/e2e/lib/upgrade-survivor/custom-plugin-siblings.mjs":"2f42c2159cf737d0f9e9dcb8abaad308a266ebfbf684bdde42a3fa101340d81e","scripts/install-smoke-candidate-payload.mts":"5f4de9d36236a4f23d769e0972a0f0904864711ff664ba3fad362137dc3902ac","scripts/run-vitest.mjs":"c3590ff935f53512a6faf3455da5e02f914fc9cbf94c5fdc962d40fbe7f5a459","scripts/lib/vitest-report-capture.mts":"efed891ab104940d6342fa902306809dc714083be53b73a1970d22a12a10a2a2","scripts/lib/vitest-worker-compiler.mts":"1481f6e708247f5308221864fed8f48528e25804ffec0ef37fe06391a958ce68","scripts/lib/vitest-worker-run.mts":"0144339d75a27d6b8a9643fa22a46dcc346f4ee387c96b4039b2ee22bd0a1433","scripts/lib/vitest-worker-artifacts.mts":"b8f30e2869db28ef1ba76139434e674fdd6381caafefb7396384ad5e82a5cefc"}'

jobs:
  package:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/fix/freebsd-plugin-snapshot-copy'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      OPENCLAW_VITEST_MAX_WORKERS: "2"
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha: ${{ steps.seal.outputs.manifest_sha }}
      archive_sha: ${{ steps.seal.outputs.archive_sha }}
      package_version: ${{ steps.seal.outputs.package_version }}
      index_sha: ${{ steps.seal.outputs.index_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Bind the workflow child to the reviewed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-plugin-copy-proof.yml
          git switch --detach "$SOURCE_SHA"
          git diff --exit-code
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
      - name: Prepare bounded proof inputs and receipt assertions
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/plugin-proof" "$RUNNER_TEMP/plugin-reports"
          export INPUT_ROOT="$RUNNER_TEMP/plugin-proof"
          git show "$BASE_SHA:src/infra/update-candidate-plugin-tree.ts" > "$INPUT_ROOT/owner-before.ts"
          cat > "$INPUT_ROOT/source-check.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          export const hash = file => createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const root = process.env.SOURCE_ROOT;
          for (const [file, digest] of Object.entries(JSON.parse(process.env.SOURCE_PINS))) {
            assert.equal(hash(path.join(root, file)), digest, file);
          }
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json')));
          assert.equal(pkg.dependencies['@openclaw/fs-safe'], '0.17.0');
          assert.match(pkg.packageManager, /^pnpm@12\.4\.0\+/);
          console.log(JSON.stringify({source:process.env.SOURCE_SHA, sourcePins:Object.keys(JSON.parse(process.env.SOURCE_PINS)).length, fsSafe:'0.17.0', pnpm:'12.4.0'}));
          NODE
          cat > "$INPUT_ROOT/reports.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const [mode, file] = process.argv.slice(2);
          const r=JSON.parse(fs.readFileSync(file)), c=JSON.parse(fs.readFileSync(`${file}.capture.json`));
          assert.equal(c.processTimedOut,false); assert.equal(c.ignoreUnhandledErrors,false);
          assert.equal(c.ended.unhandledErrors,0); assert.equal(c.ended.suiteErrors,0);
          const tests=r.testResults.flatMap(m=>m.assertionResults);
          const positive='copies a nonempty plugin without native support or sharing its source inode';
          if(mode==='red') {
            assert.equal(r.success,false); assert.equal(r.numFailedTests,1); assert.equal(r.numPassedTests,0);
            assert.equal(c.modules.length,1); assert.equal(c.ended.failedModules,1);
            const failed=tests.filter(t=>t.status==='failed'); assert.equal(failed.length,1);
            assert.equal(failed[0].title,positive);
            assert(failed[0].failureMessages.some(m=>m.includes('native no-replace move is unavailable')));
            console.log(JSON.stringify({regression:'old-owner-red',fsSafe:'0.17.0',failure:'helper-unavailable: native no-replace move is unavailable',failed:1}));
          } else {
            assert.equal(mode,'green'); assert.equal(r.success,true); assert.equal(r.numFailedTests,0);
            assert.equal(r.numPendingTests,0); assert.equal(r.numTodoTests,0); assert.equal(c.ended.failedModules,0);
            const expected=['update-candidate-plugin-tree.test.ts','update-candidate-plugin-repair.test.ts','update-candidate-plugin-sources.test.ts','update-candidate-state.inventory.test.ts','update-candidate-state.cleanup.test.ts'].sort();
            assert.deepEqual(c.modules.map(m=>path.basename(m.file)).sort(),expected);
            for(const module of r.testResults) {
              assert(module.assertionResults.length>0); assert(module.assertionResults.every(t=>t.status==='passed'));
            }
            const owner=r.testResults.find(m=>m.name.endsWith('/update-candidate-plugin-tree.test.ts'));
            assert.equal(owner.assertionResults.length,6); assert(owner.assertionResults.some(t=>t.title===positive));
            console.log(JSON.stringify({platform:process.platform,arch:process.arch,source:process.env.SOURCE_SHA,modules:expected,passed:r.numPassedTests,skipped:0,newOwnerCases:6}));
          }
          NODE
          cat > "$INPUT_ROOT/green.sh" <<'SH'
          set -eu
          node "$INPUT_ROOT/source-check.mjs"
          node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts \
            src/infra/update-candidate-plugin-tree.test.ts \
            src/infra/update-candidate-plugin-repair.test.ts \
            src/infra/update-candidate-plugin-sources.test.ts \
            src/infra/update-candidate-state.inventory.test.ts \
            src/infra/update-candidate-state.cleanup.test.ts \
            --reporter=default --reporter=json --reporter="$SOURCE_ROOT/scripts/lib/vitest-report-capture.mts" \
            --outputFile.json="$REPORT_ROOT/green.json"
          node "$INPUT_ROOT/reports.mjs" green "$REPORT_ROOT/green.json"
          node "$INPUT_ROOT/source-check.mjs"
          SH
          cat > "$INPUT_ROOT/installed-plugin.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { fileURLToPath, pathToFileURL } from 'node:url';
          const {runCommandBuffersWithTimeout}=await import(pathToFileURL(path.join(process.env.SOURCE_ROOT,'src/process/exec-runner.ts')));
          const {hasCommandProcessCleanupError}=await import(pathToFileURL(path.join(process.env.SOURCE_ROOT,'src/process/exec-result.ts')));
          let cleanupUncertain=false;
          const root=process.env.OPERATOR_ROOT, installed=process.env.INSTALLED_ROOT;
          const hash=file=>createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const fixture=path.join(process.env.SOURCE_ROOT,'scripts/e2e/lib/upgrade-survivor/custom-plugin-siblings.mjs');
          const sourceState=path.join(root,'state'), targetState=path.join(root,'snapshot'), artifacts=path.join(root,'evidence');
          fs.mkdirSync(artifacts,{recursive:true}); fs.mkdirSync(sourceState,{recursive:true});
          const env={...process.env,HOME:root,OPENCLAW_HOME:root,OPENCLAW_STATE_DIR:sourceState,OPENCLAW_CONFIG_PATH:path.join(sourceState,'openclaw.json'),OPENCLAW_UPGRADE_SURVIVOR_RUNTIME_ROOT:root,OPENCLAW_UPGRADE_SURVIVOR_ARTIFACT_ROOT:artifacts};
          async function run(argv, childEnv=env, input) {
            let r;
            try {r=await runCommandBuffersWithTimeout([process.execPath,...argv],{env:childEnv,cwd:root,input,timeoutMs:300000,maxOutputBytes:8*1024*1024,killProcessTree:true,requireProcessTreeExtinction:true});}
            catch(error){cleanupUncertain ||= hasCommandProcessCleanupError(error)||error?.cleanup==='uncertain';throw error;}
            cleanupUncertain ||= r.cleanup==='uncertain';
            process.stderr.write(r.stderr);
            assert(!cleanupUncertain); assert.equal(Boolean(r.outputLimitExceeded),false); assert.equal(r.outputErrorStream,undefined);
            assert.equal(r.termination,'exit'); assert.equal(r.signal,null); assert.equal(r.code,0,`command failed: ${argv.join(' ')}\n${r.stdout}`);
            return r.stdout.toString('utf8');
          }
          await run([fixture,'seed']);
          const config=JSON.parse(fs.readFileSync(env.OPENCLAW_CONFIG_PATH));
          const sources=JSON.parse(fs.readFileSync(path.join(artifacts,'sibling-source.json')));
          const worker=path.join(installed,'dist/infra/update-candidate-state.worker.js');
          assert(fs.lstatSync(worker).isFile());
          const input={stateDir:sourceState,targetStateDir:targetState,candidateRoot:installed,config,env};
          const inventory=JSON.parse(await run([worker],env,JSON.stringify({...input,mode:'inventory'})));
          assert(inventory.pluginBytes>0); assert(Array.isArray(inventory.databases));
          const databaseInventory=inventory.databases.map(entry=>{assert(Array.isArray(entry)&&entry.length===2&&typeof entry[0]==='string');return entry[0];});
          const snapshot=JSON.parse(await run([worker],env,JSON.stringify({...input,mode:'snapshot',pluginPlanPath:path.join(targetState,inventory.pluginPlan),databaseInventory})));
          const originalPlugin=config.plugins.load.paths[0], copiedPlugin=snapshot.pluginPaths[originalPlugin];
          const within=file=>{const r=path.relative(targetState,file);return r!==''&&r!=='..'&&!r.startsWith(`..${path.sep}`)&&!path.isAbsolute(r);};
          assert(typeof copiedPlugin==='string'&&within(copiedPlugin));
          const copiedShared=path.resolve(copiedPlugin,'../shared/value.mjs'); assert(within(copiedShared));
          assert.equal(hash(copiedShared),sources[path.join(root,'custom-plugins/shared/value.mjs')]);
          for(const name of ['index.mjs','doctor-contract-api.mjs','package.json','openclaw.plugin.json']) {
            const source=path.join(originalPlugin,name), copy=path.join(copiedPlugin,name);
            assert.equal(hash(copy),sources[source]);
            assert.notEqual(fs.statSync(copy).ino,fs.statSync(source).ino);
            assert.equal(fs.statSync(copy).mode&0o777,fs.statSync(source).mode&0o777);
          }
          config.plugins.load.paths=[copiedPlugin];
          config.agents.defaults.workspace=path.join(targetState,'workspace');
          const copiedConfig=path.join(targetState,'openclaw.json'); fs.writeFileSync(copiedConfig,JSON.stringify(config),{flag:'wx',mode:0o600});
          const privateEnv={...env,HOME:targetState,OPENCLAW_HOME:targetState,OPENCLAW_STATE_DIR:targetState,OPENCLAW_CONFIG_PATH:copiedConfig,OPENCLAW_SERVICE_REPAIR_POLICY:'external'};
          const originals=path.join(root,'custom-plugins'), retained=path.join(root,'retained-originals');
          fs.renameSync(originals,retained);
          try {
            const launcher=path.join(installed,'openclaw.mjs');
            const doctor=await run([launcher,'doctor','--fix','--non-interactive'],privateEnv);
            fs.writeFileSync(path.join(artifacts,'doctor.log'),doctor); process.stdout.write(doctor);
            const inspect=JSON.parse(await run([launcher,'plugins','inspect','survivor-sibling-memory','--runtime','--json'],privateEnv));
            assert.equal(inspect.plugin?.status,'loaded');
            const events=fs.readFileSync(path.join(artifacts,'sibling-registrations.jsonl'),'utf8').trim().split('\n').filter(Boolean).map(row=>JSON.parse(row));
            const selected=events.filter(e=>e.stateDir===targetState);
            assert(selected.some(e=>e.surface==='doctor-contract'),'actual copied Doctor contract required');
            assert(selected.some(e=>e.surface==='runtime'),'actual copied runtime registration required');
            for(const event of selected) {
              assert.equal(event.value,'OPENCLAW_SIBLING_SOURCE_OK');
              for(const field of ['source','sharedSource']) assert(within(fileURLToPath(event[field])));
            }
            console.log(JSON.stringify({installedPluginProof:true,source:process.env.SOURCE_SHA,build:JSON.parse(fs.readFileSync(path.join(installed,'dist/build-info.json'))),snapshotBytes:inventory.pluginBytes,doctorExit:0,pluginStatus:inspect.plugin.status,privateExecutions:selected.length,foregroundUpdateQualification:false,armQualification:false}));
          } finally {if(!cleanupUncertain)fs.renameSync(retained,originals);}
          for(const [file,digest] of Object.entries(sources)) assert.equal(hash(file),digest);
          console.log('Original configured plugin and sibling source hashes preserved');
          NODE
      - name: Original owner red and reviewed owner green on the current dependency
        run: |
          set -euo pipefail
          export INPUT_ROOT="$RUNNER_TEMP/plugin-proof" SOURCE_ROOT="$PWD" REPORT_ROOT="$RUNNER_TEMP/plugin-reports"
          node "$INPUT_ROOT/source-check.mjs"
          test "$(pnpm --version)" = 12.4.0
          (
            owner=src/infra/update-candidate-plugin-tree.ts
            cp "$owner" "$RUNNER_TEMP/owner-after.ts"
            trap 'cp "$RUNNER_TEMP/owner-after.ts" "$owner"' EXIT
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import {createHash} from 'node:crypto';
            assert.equal(createHash('sha256').update(fs.readFileSync(`${process.env.INPUT_ROOT}/owner-before.ts`)).digest('hex'),'659a6f15d42a12f7eb3546867e198df0041588d2b46d43a1549c3827689b510c');
          NODE
            cp "$INPUT_ROOT/owner-before.ts" "$owner"
            if node scripts/run-vitest.mjs run --config test/vitest/vitest.infra.config.ts src/infra/update-candidate-plugin-tree.test.ts \
              --testNamePattern 'copies a nonempty plugin without native support or sharing its source inode' \
              --reporter=default --reporter=json --reporter="$SOURCE_ROOT/scripts/lib/vitest-report-capture.mts" \
              --outputFile.json="$REPORT_ROOT/red.json"; then red=0; else red=$?; fi
            test "$red" -ne 0
            node "$INPUT_ROOT/reports.mjs" red "$REPORT_ROOT/red.json"
          )
          bash "$INPUT_ROOT/green.sh"
          git diff --exit-code
      - name: Build and seal one current candidate
        id: seal
        run: |
          set -euo pipefail
          export INPUT_ROOT="$RUNNER_TEMP/plugin-proof" SOURCE_ROOT="$PWD"
          git archive --format=tar.gz --prefix=openclaw/ "$SOURCE_SHA" > "$INPUT_ROOT/source.tar.gz"
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/candidate-package" --output-name candidate.tgz \
            --pack-json "$RUNNER_TEMP/candidate-pack.json"
          node "$INPUT_ROOT/source-check.mjs"
          git diff --exit-code
          node scripts/install-smoke-candidate-payload.mts seal \
            --archive "$INPUT_ROOT/source.tar.gz" --package-dir "$RUNNER_TEMP/candidate-package" --output-dir "$INPUT_ROOT/payload" \
            --repository "$GITHUB_REPOSITORY" --target-sha "$SOURCE_SHA" \
            --harness-repository "$GITHUB_REPOSITORY" --harness-sha "$HARNESS_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          const root=process.env.INPUT_ROOT, hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const manifestFile=path.join(root,'payload/install-smoke-candidate-payload.json'),manifest=JSON.parse(fs.readFileSync(manifestFile));
          const files=[];
          function walk(relative=''){for(const name of fs.readdirSync(path.join(root,relative)).sort()){const file=path.join(relative,name),stat=fs.lstatSync(path.join(root,file));if(stat.isDirectory())walk(file);else{assert(stat.isFile());files.push({file,size:stat.size,sha256:hash(path.join(root,file))});}}}
          walk();assert(files.length<=12);assert(files.reduce((n,f)=>n+f.size,0)<256*1024*1024);
          const index=path.join(root,'proof-index.json');fs.writeFileSync(index,JSON.stringify({source:process.env.SOURCE_SHA,harness:process.env.HARNESS_SHA,files}),{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`manifest_sha=${hash(manifestFile)}\narchive_sha=${manifest.sourceArchiveSha256}\npackage_version=${manifest.packageVersion}\nindex_sha=${hash(index)}\n`);
          console.log(JSON.stringify({source:process.env.SOURCE_SHA,harness:process.env.HARNESS_SHA,manifestSha256:hash(manifestFile),archiveSha256:manifest.sourceArchiveSha256,indexSha256:hash(index),files}));
          NODE
      - name: Retain the immutable source, candidate and proof inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-proof
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  linux-survivor:
    needs: package
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 75
    env:
      INDEX_SHA: ${{ needs.package.outputs.index_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          cache-mode: "off"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: proof-input
          merge-multiple: true
      - &verify-inputs
        name: Authenticate every proof input
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(hash('proof-input/proof-index.json'),process.env.INDEX_SHA);
          const index=JSON.parse(fs.readFileSync('proof-input/proof-index.json'));
          assert.equal(index.source,process.env.SOURCE_SHA);assert.equal(index.harness,process.env.HARNESS_SHA);
          for(const {file,size,sha256} of index.files){assert(!path.isAbsolute(file)&&!file.split('/').includes('..'));const p=path.join('proof-input',file),s=fs.lstatSync(p);assert(s.isFile());assert.equal(s.size,size);assert.equal(hash(p),sha256);}
          console.log(JSON.stringify({source:index.source,harness:index.harness,indexSha256:process.env.INDEX_SHA,files:index.files.length}));
          NODE
      - name: Published-driver custom plugin sibling survivor
        env:
          OPENCLAW_UPGRADE_SURVIVOR_PUBLISHED_BASELINE: "1"
          OPENCLAW_UPGRADE_SURVIVOR_BASELINE_SPEC: openclaw@2026.9.4
          OPENCLAW_UPGRADE_SURVIVOR_SCENARIO: custom-plugin-siblings
        run: |
          set -euo pipefail
          export SOURCE_ROOT="$PWD" INPUT_ROOT="$PWD/proof-input"
          node "$INPUT_ROOT/source-check.mjs"
          # This canonical scenario exercises the released 9.4 driver's omitted sibling projection.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://registry.npmjs.org/openclaw/2026.9.4',{signal:AbortSignal.timeout(30000)});
          assert(response.ok);const published=await response.json();
          assert.equal(published.name,'openclaw');assert.equal(published.version,'2026.9.4');
          assert.equal(published.dist.tarball,'https://registry.npmjs.org/openclaw/-/openclaw-2026.9.4.tgz');
          assert.equal(published.dist.integrity,'sha512-lTQpEEe1Xm3u2PCHaPEr+vP8paGk1vLdHuzdItsNToaLI6hAqRVvgJYg+GxukJhETJp4tPy/S1Gftl4KuB8n7A==');
          console.log(JSON.stringify({publishedRegistryMetadata:{name:published.name,version:published.version,tarball:published.dist.tarball,integrity:published.dist.integrity}}));
          NODE
          export OPENCLAW_CURRENT_PACKAGE_TGZ="$INPUT_ROOT/payload/candidate.tgz"
          export OPENCLAW_UPGRADE_SURVIVOR_ARTIFACT_DIR="$RUNNER_TEMP/plugin-survivor"
          bash scripts/e2e/upgrade-survivor-docker.sh
          node "$INPUT_ROOT/source-check.mjs"

  freebsd:
    needs: [package, linux-survivor]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INDEX_SHA: ${{ needs.package.outputs.index_sha }}
      MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha }}
      ARCHIVE_SHA: ${{ needs.package.outputs.archive_sha }}
      PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
      ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
      PROOF_REPOSITORY: ${{ github.repository }}
      PROOF_RUN_ID: ${{ github.run_id }}
      PROOF_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/install-smoke-candidate-payload.mts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: proof-input
          merge-multiple: true
      - *verify-inputs
      - name: Real FreeBSD copy, repair and installed plugin Doctor
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: x86_64
          mem: 8192
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA HARNESS_SHA SOURCE_PINS INDEX_SHA MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION ARTIFACT_ID ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 corepack ca_root_nss git-lite gmake python3 bash
          run: |
            set -eu
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
            const release=execFileSync('/bin/freebsd-version',['-u'],{encoding:'utf8'}).trim();
            assert.match(release,/^15\.1-RELEASE(?:-p\d+)?$/);assert.equal(process.platform,'freebsd');assert.equal(process.arch,'x64');assert.equal(process.getuid(),0);assert.equal(process.geteuid(),0);assert.match(process.version,/^v24\./);
            console.log(JSON.stringify({release,node:process.version,platform:process.platform,arch:process.arch,uid:process.getuid()}));
            NODE
            node scripts/install-smoke-candidate-payload.mts verify \
              --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
              --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
              --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA" \
              --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA" \
              --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
            export INPUT_ROOT="$(pwd)/proof-input"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
            const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex'),root=process.env.INPUT_ROOT;
            assert.equal(hash(path.join(root,'proof-index.json')),process.env.INDEX_SHA);
            const index=JSON.parse(fs.readFileSync(path.join(root,'proof-index.json')));
            assert.equal(index.source,process.env.SOURCE_SHA);assert.equal(index.harness,process.env.HARNESS_SHA);
            for(const {file,size,sha256} of index.files){assert(!path.isAbsolute(file)&&!file.split('/').includes('..'));const p=path.join(root,file),st=fs.lstatSync(p);assert(st.isFile());assert.equal(st.size,size);assert.equal(hash(p),sha256);}
            assert.equal(hash(path.join(root,'source.tar.gz')),process.env.ARCHIVE_SHA);
            NODE
            PROOF_ROOT=$(mktemp -d /root/openclaw-plugin-proof.XXXXXX)
            export PROOF_ROOT
            chmod 0700 "$PROOF_ROOT"
            mkdir "$PROOF_ROOT/source" "$PROOF_ROOT/package-view" "$PROOF_ROOT/reports" "$PROOF_ROOT/tmp" "$PROOF_ROOT/operator"
            tar --no-same-permissions -xzf "$INPUT_ROOT/source.tar.gz" -C "$PROOF_ROOT/source"
            tar --no-same-permissions -xzf "$INPUT_ROOT/payload/candidate.tgz" -C "$PROOF_ROOT/package-view"
            export SOURCE_ROOT="$PROOF_ROOT/source/openclaw" REPORT_ROOT="$PROOF_ROOT/reports"
            export TMPDIR="$PROOF_ROOT/tmp" TMP="$PROOF_ROOT/tmp" TEMP="$PROOF_ROOT/tmp"
            export CI=true OPENCLAW_VITEST_MAX_WORKERS=1
            cd "$SOURCE_ROOT"
            node "$INPUT_ROOT/source-check.mjs"
            corepack enable
            test "$(pnpm --version)" = 12.4.0
            pnpm --filter 'openclaw...' --filter '@openclaw/markdown-core...' --fail-if-no-match list --depth -1 --json > "$PROOF_ROOT/workspaces.json"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
            const rows=JSON.parse(fs.readFileSync(`${process.env.PROOF_ROOT}/workspaces.json`));
            const actual=rows.map(r=>[r.name,path.relative(process.env.SOURCE_ROOT,r.path)||'.']).sort();
            const expected=[['openclaw','.'],['@openclaw/ai','packages/ai'],['@openclaw/markdown-core','packages/markdown-core'],['@openclaw/model-catalog-core','packages/model-catalog-core'],['@openclaw/normalization-core','packages/normalization-core'],['@openclaw/session-url-contract','packages/session-url-contract']].sort();
            assert.deepEqual(actual,expected);console.log(JSON.stringify({nativeSourceWorkspaces:actual,pnpm:'12.4.0'}));
            NODE
            pnpm --filter 'openclaw...' --filter '@openclaw/markdown-core...' --fail-if-no-match install --frozen-lockfile
            node "$INPUT_ROOT/source-check.mjs"
            test ! -e dist
            cp -R "$PROOF_ROOT/package-view/package/dist" dist
            bash "$INPUT_ROOT/green.sh"
            export OPERATOR_ROOT="$PROOF_ROOT/operator" HOME="$PROOF_ROOT/operator"
            export npm_config_prefix="$PROOF_ROOT/prefix"
            npm --version
            npm install --global "file:$INPUT_ROOT/payload/candidate.tgz" "--allow-scripts=file:$INPUT_ROOT/payload/candidate.tgz" --no-audit --no-fund
            export INSTALLED_ROOT="$npm_config_prefix/lib/node_modules/openclaw"
            export PATH="$npm_config_prefix/bin:$PATH"
            cat > "$PROOF_ROOT/verify-content.mjs" <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
            const original=path.join(process.env.PROOF_ROOT,'package-view/package'),installed=process.env.INSTALLED_ROOT;
            const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');let count=0;
            function compare(relative){const source=path.join(original,relative),targets=[path.join(installed,relative),...((relative==='dist'||relative.startsWith('dist/'))?[path.join(process.env.SOURCE_ROOT,relative)]:[])];const stat=fs.lstatSync(source);if(stat.isDirectory()){const names=fs.readdirSync(source).sort();for(const target of targets)assert.deepEqual(fs.readdirSync(target).sort(),names);for(const name of names)compare(path.join(relative,name));}else{assert(stat.isFile());for(const target of targets){assert(fs.lstatSync(target).isFile());assert.equal(hash(target),hash(source),relative);}count++;}}
            compare('dist');compare('openclaw.mjs');compare('package.json');
            const build=JSON.parse(fs.readFileSync(path.join(installed,'dist/build-info.json')));assert.equal(build.commit,process.env.SOURCE_SHA);assert(build.buildId);
            assert.equal(fs.realpathSync(path.join(process.env.npm_config_prefix,'bin/openclaw')),path.join(installed,'openclaw.mjs'));
            console.log(JSON.stringify({installedBuild:build,contentFiles:count,artifact:process.env.ARTIFACT_ID,digest:process.env.ARTIFACT_DIGEST}));
            NODE
            node "$PROOF_ROOT/verify-content.mjs"
            node --import "$SOURCE_ROOT/scripts/tsx.mjs" "$INPUT_ROOT/installed-plugin.mjs"
            node "$PROOF_ROOT/verify-content.mjs"
            node "$INPUT_ROOT/source-check.mjs"
            echo 'FreeBSD x64 nonempty plugin snapshot/repair and installed Doctor proof complete; no foreground-update or ARM qualification'
