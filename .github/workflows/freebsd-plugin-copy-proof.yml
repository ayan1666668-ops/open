# Temporary qualification for PR 154354; remove before landing.
name: Temporary plugin copy proof

on:
  push:
    branches: [fix/freebsd-plugin-snapshot-copy]

permissions:
  contents: read
  actions: read

concurrency:
  group: freebsd-plugin-copy-154354
  cancel-in-progress: false

env:
  SOURCE_SHA: f636bc7ec3915462d365bb2d0959abd39fcfe864
  SOURCE_TREE: f2cbba179f42514af6fb7cc14385e005c7593831
  BASE_SHA: 6bb897a7231a3cb681186b0645a9c1cdd1dcf3b3
  HARNESS_SHA: b581b136ff05f7c98c00989645fe7d6bd70dc492
  CONSUMER_SHA: ${{ github.sha }}
  SOURCE_PINS: '{"package.json":"6c4394cc9de73b833136f4aa8857d2dd164a9a57a86832e0eb0939e6770c2480","pnpm-lock.yaml":"1f8a8e068df19803f7492454c7c6283a6630a0cf05417044d81b24c1cd5a188a","pnpm-workspace.yaml":"edced18940dc8b3c31210b327561fca062ce6cebebe92893be983ed604f64ee8",".npmrc":"f1d021e2abdf8817d83e35feb1f5d604e8c985aa0553bec3d417cf6f93e9c09c","packages/ai/package.json":"61eefcb38095a41de445f781c738cb1f89c960ddf6c56f39c6d61970d8db277b","packages/markdown-core/package.json":"eb934f4829a87292edff90480e2c060e636afdd75d35a3ffc02a55581e37a548","packages/model-catalog-core/package.json":"0cef9224746d0eed66278f729b6edf4d6e7cdf31fd35b16af62bae0aa4635331","packages/normalization-core/package.json":"2bfc2ae79211db8023b168e8dd6c5f378dd64e0890b32ae9a043d38c867683a5","packages/session-url-contract/package.json":"ce05f27abdafc0ff033aadf0d0944f8c48681d5eebcd5dec7485e64215abe827","src/infra/update-candidate-plugin-tree.ts":"060022e39079e54588f263364c37145115d514dfc108ca67f9443a438027822b","src/infra/update-candidate-plugin-tree.test.ts":"d3a558a42bf56b44996438a38fb2263b38137ad1ab1a2e7efe4485d305ab63e5","src/infra/update-candidate-plugin-repair.ts":"2e23d5e676d91d486a145236d0a36804efe9c81e59e64b7e2267a296d06ad114","src/infra/update-candidate-plugin-repair.test.ts":"a4b751210bba8d9f8ca91c40536e0bef06c30b1f67a25a740469b8fbe4ee5256","src/infra/update-candidate-plugin-sources.test.ts":"6ef2ff6ecf1e43d1373f2b895fda6bdcd24527fcbdaf52379cdc1900e808f574","src/infra/update-candidate-state.inventory.test.ts":"9c0c618be0168ae91c88cd6cef3f019e2f6bf7be3ea9e37099dfc0bef38e7984","src/infra/update-candidate-state.cleanup.test.ts":"56cb92f80680c90e0b004899fda92e68a3e45786e89d69d63c8c45adaf912d43","src/infra/update-candidate-snapshot.ts":"a36fbba2f5925599498821f1704e2154cab9050001e3d831fe1b7ac6ece43614","src/infra/update-candidate-state.ts":"3bd94c4d798769e28176071df5a583b18a2deef8b64c23b16ac3d36c861ced9e","src/infra/update-candidate-state.worker.ts":"98528b867ad9ba6afd731b347cbe0b9d37c364c9e51a29a673ea1b57e9fbee08","src/infra/update-candidate-plugins.ts":"da960f5b2465dfa286dc40be8d42fbc83800fea6143b66d19f28d25376eb7092","src/process/exec-runner.ts":"db5c44d06696bdb97e58636290a81da2081bf82be7c5e260a28f9984a10f7f43","src/process/exec-result.ts":"8bcacfd0b9fa8c69c5e659d7076b111ec83ac7fd2885ade9204e85e0c69ce7f8","src/process/exec-termination.ts":"f2d789806f347701d73fddff08eb196df4911138fdc4bd48de256b5337b5a13c","scripts/e2e/lib/upgrade-survivor/custom-plugin-siblings.mjs":"2f42c2159cf737d0f9e9dcb8abaad308a266ebfbf684bdde42a3fa101340d81e","scripts/install-smoke-candidate-payload.mts":"5f4de9d36236a4f23d769e0972a0f0904864711ff664ba3fad362137dc3902ac","scripts/run-vitest.mjs":"c3590ff935f53512a6faf3455da5e02f914fc9cbf94c5fdc962d40fbe7f5a459","scripts/lib/vitest-report-capture.mts":"efed891ab104940d6342fa902306809dc714083be53b73a1970d22a12a10a2a2","scripts/lib/vitest-worker-compiler.mts":"1481f6e708247f5308221864fed8f48528e25804ffec0ef37fe06391a958ce68","scripts/lib/vitest-worker-run.mts":"0144339d75a27d6b8a9643fa22a46dcc346f4ee387c96b4039b2ee22bd0a1433","scripts/lib/vitest-worker-artifacts.mts":"b8f30e2869db28ef1ba76139434e674fdd6381caafefb7396384ad5e82a5cefc"}'

jobs:
  freebsd:
    if: github.repository == 'openclaw/openclaw' && github.ref == 'refs/heads/fix/freebsd-plugin-snapshot-copy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INDEX_SHA: "937999a921041181ac53011345c796a2629b71432f16d793605afbab6debb7d5"
      MANIFEST_SHA: "9d7790ace2ecc0cf44318c1702f9cb7f9357cb1f00ebf39489953d173fbbc5b1"
      ARCHIVE_SHA: "e894110fb81d5da29163fb117ff0e55b62359c5ce5750504291d212d47b0d13e"
      PACKAGE_VERSION: "2026.9.5"
      ARTIFACT_ID: "10621084827"
      ARTIFACT_DIGEST: "b4ca482d9ea1253b48436c8dce506f8f04ecacd1fd33e9fb9c19f85c55d5a4e4"
      PROOF_REPOSITORY: openclaw/openclaw
      PROOF_RUN_ID: "35558208616"
      PROOF_RUN_ATTEMPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/install-smoke-candidate-payload.mts
            /.github/workflows/freebsd-plugin-copy-proof.yml
      - name: Bind the native-only consumer to the accepted source and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONSUMER_SHA"
          test "$(git rev-parse HEAD^)" = "$HARNESS_SHA"
          test "$(git rev-parse HEAD^^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = f19eb55e515a287b35df51152118f8c010ccc00e
          test "$(git rev-parse "$SOURCE_SHA^^")" = 85038d22637e4ad00c9311529a37ce9189f346f0
          test "$(git rev-parse "$SOURCE_SHA^^^")" = "$BASE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = .github/workflows/freebsd-plugin-copy-proof.yml
          echo 'Carried producer 35558208616/a1/job106205888460: 72/72 tests, canonical build/seal; log 268491 bytes SHA256 98dee25bf3458b1ef65433f79bd008993aaf568ef335bd9e575c927caf0dd23b.'
          echo 'Carried Linux custom-plugin-siblings 35558208616/a1/job106207373580: scenario passed with six actual canary plugin executions and preserved source; log 126082 bytes SHA256 2d597ca126bf56ae51a91afcfd4991048ac8d732f0c7d568d005dd272ba2011e. Does not independently assert final updater status=ok.'
          echo 'Prior native job106207862746 failed at Corepack pnpm bootstrap before tests; this consumer reruns only native proof using the same sealed artifact.'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch(`https://api.github.com/repos/${process.env.PROOF_REPOSITORY}/actions/artifacts/${process.env.ARTIFACT_ID}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},signal:AbortSignal.timeout(30000)});
          assert(response.ok);const artifact=await response.json();
          assert.equal(String(artifact.id),process.env.ARTIFACT_ID);assert.equal(artifact.expired,false);
          assert.equal(artifact.size_in_bytes,239261711);assert.equal(artifact.digest,`sha256:${process.env.ARTIFACT_DIGEST}`);
          assert.equal(String(artifact.workflow_run.id),process.env.PROOF_RUN_ID);assert.equal(artifact.workflow_run.head_sha,process.env.HARNESS_SHA);
          console.log(JSON.stringify({consumer:process.env.CONSUMER_SHA,source:process.env.SOURCE_SHA,artifact:artifact.id,digest:artifact.digest,producer:artifact.workflow_run.id,expires:artifact.expires_at}));
          NODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          github-token: ${{ github.token }}
          repository: ${{ env.PROOF_REPOSITORY }}
          run-id: ${{ env.PROOF_RUN_ID }}
          path: proof-input
          merge-multiple: true
      - name: Authenticate every proof input
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
          const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          assert.equal(hash('proof-input/proof-index.json'),process.env.INDEX_SHA);
          const index=JSON.parse(fs.readFileSync('proof-input/proof-index.json'));
          assert.equal(index.source,process.env.SOURCE_SHA);assert.equal(index.harness,process.env.HARNESS_SHA);
          for(const {file,size,sha256} of index.files){assert(!path.isAbsolute(file)&&!file.split('/').includes('..'));const p=path.join('proof-input',file),s=fs.lstatSync(p);assert(s.isFile());assert.equal(s.size,size);assert.equal(hash(p),sha256);}
          console.log(JSON.stringify({source:index.source,harness:index.harness,indexSha256:process.env.INDEX_SHA,files:index.files.length}));
          NODE
      - name: Real FreeBSD copy, repair and installed plugin Doctor
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          release: "15.1"
          arch: x86_64
          mem: 8192
          sync: rsync
          copyback: false
          disable-cache: true
          debug-on-error: false
          envs: SOURCE_SHA HARNESS_SHA SOURCE_PINS INDEX_SHA MANIFEST_SHA ARCHIVE_SHA PACKAGE_VERSION ARTIFACT_ID ARTIFACT_DIGEST PROOF_REPOSITORY PROOF_RUN_ID PROOF_RUN_ATTEMPT
          prepare: |
            set -eu
            mkdir -p /usr/local/etc/pkg/repos
            cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'REPO'
            FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }
            REPO
            pkg install -y node24 npm-node24 ca_root_nss git-lite gmake python3 bash
          run: |
            set -eu
            umask 022
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';
            const release=execFileSync('/bin/freebsd-version',['-u'],{encoding:'utf8'}).trim();
            assert.match(release,/^15\.1-RELEASE(?:-p\d+)?$/);assert.equal(process.platform,'freebsd');assert.equal(process.arch,'x64');assert.equal(process.getuid(),0);assert.equal(process.geteuid(),0);assert.match(process.version,/^v24\./);
            console.log(JSON.stringify({release,node:process.version,platform:process.platform,arch:process.arch,uid:process.getuid()}));
            NODE
            node scripts/install-smoke-candidate-payload.mts verify \
              --payload-dir proof-input/payload --manifest-sha256 "$MANIFEST_SHA" \
              --source-archive-sha256 "$ARCHIVE_SHA" --package-version "$PACKAGE_VERSION" \
              --repository "$PROOF_REPOSITORY" --target-sha "$SOURCE_SHA" \
              --harness-repository "$PROOF_REPOSITORY" --harness-sha "$HARNESS_SHA" \
              --run-id "$PROOF_RUN_ID" --run-attempt "$PROOF_RUN_ATTEMPT"
            export INPUT_ROOT="$(pwd)/proof-input"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
            const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex'),root=process.env.INPUT_ROOT;
            assert.equal(hash(path.join(root,'proof-index.json')),process.env.INDEX_SHA);
            const index=JSON.parse(fs.readFileSync(path.join(root,'proof-index.json')));
            assert.equal(index.source,process.env.SOURCE_SHA);assert.equal(index.harness,process.env.HARNESS_SHA);
            for(const {file,size,sha256} of index.files){assert(!path.isAbsolute(file)&&!file.split('/').includes('..'));const p=path.join(root,file),st=fs.lstatSync(p);assert(st.isFile());assert.equal(st.size,size);assert.equal(hash(p),sha256);}
            assert.equal(hash(path.join(root,'source.tar.gz')),process.env.ARCHIVE_SHA);
            NODE
            PROOF_ROOT=$(mktemp -d /root/openclaw-plugin-proof.XXXXXX)
            export PROOF_ROOT
            chmod 0700 "$PROOF_ROOT"
            mkdir "$PROOF_ROOT/source" "$PROOF_ROOT/package-view" "$PROOF_ROOT/reports" "$PROOF_ROOT/tmp" "$PROOF_ROOT/operator"
            tar --no-same-permissions -xzf "$INPUT_ROOT/source.tar.gz" -C "$PROOF_ROOT/source"
            tar --no-same-permissions -xzf "$INPUT_ROOT/payload/candidate.tgz" -C "$PROOF_ROOT/package-view"
            export SOURCE_ROOT="$PROOF_ROOT/source/openclaw" REPORT_ROOT="$PROOF_ROOT/reports"
            export TMPDIR="$PROOF_ROOT/tmp" TMP="$PROOF_ROOT/tmp" TEMP="$PROOF_ROOT/tmp"
            export CI=true OPENCLAW_VITEST_MAX_WORKERS=1
            cd "$SOURCE_ROOT"
            node "$INPUT_ROOT/source-check.mjs"
            # Corepack omits optional packages and its v12 downloader rejects FreeBSD.
            # The official npm wrapper supports the installed FreeBSD x64 package.
            (cd "$PROOF_ROOT" && npm install --prefix "$PROOF_ROOT/pnpm" --ignore-scripts --include=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ pnpm@12.4.0)
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {pathToFileURL} from 'node:url';
            const root=path.join(process.env.PROOF_ROOT,'pnpm'),lock=JSON.parse(fs.readFileSync(path.join(root,'package-lock.json')));
            for(const [name,integrity,tarball] of [
              ['pnpm','sha512-N1NsJu1Aq0E0tlEeCfayfz67RWh0aPJAbKOAUnmk5coVjBkxNQrZd01qshCNcbPbrrOZQxWSlDdeTQU+jgVoXA==','https://registry.npmjs.org/pnpm/-/pnpm-12.4.0.tgz'],
              ['@pnpm/exe.freebsd-x64','sha512-A45d6axdQIFNyNTYZAC64wh5+6LJ6dNKhNAoNMNi/EC5y9CRfv0GL3ZYDBqpkmsN9KMAkVsFWizq/Ng6xtjnhw==','https://registry.npmjs.org/@pnpm/exe.freebsd-x64/-/exe.freebsd-x64-12.4.0.tgz'],
            ]){const entry=lock.packages[`node_modules/${name}`];assert.equal(entry.version,'12.4.0');assert.equal(entry.integrity,integrity);assert.equal(entry.resolved,tarball);const installed=JSON.parse(fs.readFileSync(path.join(root,'node_modules',name,'package.json')));assert.equal(installed.name,name);assert.equal(installed.version,'12.4.0');}
            const {resolveInstalledBinary}=await import(pathToFileURL(path.join(root,'node_modules/pnpm/native-binary.mjs')));
            assert.equal(resolveInstalledBinary(),path.join(root,'node_modules/@pnpm/exe.freebsd-x64/pnpm'));
            console.log(JSON.stringify({nativePnpm:'12.4.0',platformPackage:'@pnpm/exe.freebsd-x64',registryIntegrityVerified:true,lifecycleScripts:false}));
            NODE
            export PATH="$PROOF_ROOT/pnpm/node_modules/.bin:$PATH"
            test "$(pnpm --version)" = 12.4.0
            pnpm --filter 'openclaw...' --filter '@openclaw/markdown-core...' --fail-if-no-match list --depth -1 --json > "$PROOF_ROOT/workspaces.json"
            node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
            const rows=JSON.parse(fs.readFileSync(`${process.env.PROOF_ROOT}/workspaces.json`));
            const actual=rows.map(r=>[r.name,path.relative(process.env.SOURCE_ROOT,r.path)||'.']).sort();
            const expected=[['openclaw','.'],['@openclaw/ai','packages/ai'],['@openclaw/markdown-core','packages/markdown-core'],['@openclaw/model-catalog-core','packages/model-catalog-core'],['@openclaw/normalization-core','packages/normalization-core'],['@openclaw/session-url-contract','packages/session-url-contract']].sort();
            assert.deepEqual(actual,expected);console.log(JSON.stringify({nativeSourceWorkspaces:actual,pnpm:'12.4.0'}));
            NODE
            pnpm --filter 'openclaw...' --filter '@openclaw/markdown-core...' --fail-if-no-match install --frozen-lockfile
            node "$INPUT_ROOT/source-check.mjs"
            test ! -e dist
            cp -R "$PROOF_ROOT/package-view/package/dist" dist
            bash "$INPUT_ROOT/green.sh"
            export OPERATOR_ROOT="$PROOF_ROOT/operator" HOME="$PROOF_ROOT/operator"
            export npm_config_prefix="$PROOF_ROOT/prefix"
            npm --version
            npm install --global "file:$INPUT_ROOT/payload/candidate.tgz" "--allow-scripts=file:$INPUT_ROOT/payload/candidate.tgz" --no-audit --no-fund
            export INSTALLED_ROOT="$npm_config_prefix/lib/node_modules/openclaw"
            export PATH="$npm_config_prefix/bin:$PATH"
            cat > "$PROOF_ROOT/verify-content.mjs" <<'NODE'
            import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';import {createHash} from 'node:crypto';
            const original=path.join(process.env.PROOF_ROOT,'package-view/package'),installed=process.env.INSTALLED_ROOT;
            const hash=f=>createHash('sha256').update(fs.readFileSync(f)).digest('hex');let count=0;
            function compare(relative){const source=path.join(original,relative),targets=[path.join(installed,relative),...((relative==='dist'||relative.startsWith('dist/'))?[path.join(process.env.SOURCE_ROOT,relative)]:[])];const stat=fs.lstatSync(source);if(stat.isDirectory()){const names=fs.readdirSync(source).sort();for(const target of targets)assert.deepEqual(fs.readdirSync(target).sort(),names);for(const name of names)compare(path.join(relative,name));}else{assert(stat.isFile());for(const target of targets){assert(fs.lstatSync(target).isFile());assert.equal(hash(target),hash(source),relative);}count++;}}
            compare('dist');compare('openclaw.mjs');compare('package.json');
            const build=JSON.parse(fs.readFileSync(path.join(installed,'dist/build-info.json')));assert.equal(build.commit,process.env.SOURCE_SHA);assert(build.buildId);
            assert.equal(fs.realpathSync(path.join(process.env.npm_config_prefix,'bin/openclaw')),path.join(installed,'openclaw.mjs'));
            console.log(JSON.stringify({installedBuild:build,contentFiles:count,artifact:process.env.ARTIFACT_ID,digest:process.env.ARTIFACT_DIGEST}));
            NODE
            node "$PROOF_ROOT/verify-content.mjs"
            node --import "$SOURCE_ROOT/scripts/tsx.mjs" "$INPUT_ROOT/installed-plugin.mjs"
            node "$PROOF_ROOT/verify-content.mjs"
            node "$INPUT_ROOT/source-check.mjs"
            echo 'FreeBSD x64 nonempty plugin snapshot/repair and installed Doctor proof complete; no foreground-update or ARM qualification'
