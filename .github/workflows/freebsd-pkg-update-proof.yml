name: Temporary FreeBSD pkg update proof

# Remove this workflow and its fixture after the reviewed native receipt.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: freebsd-pkg-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  package:
    name: Build FreeBSD update proof package
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/freebsd-pkg-update-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      run-head-sha: ${{ steps.source.outputs.run-head-sha }}
      manifest-sha: ${{ steps.source.outputs.manifest-sha }}
      candidate-sha: ${{ steps.source.outputs.candidate-sha }}
      first-hop-sha: ${{ steps.source.outputs.first-hop-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.artifact.outputs.artifact-digest }}
      artifact-size: ${{ steps.artifact.outputs.artifact-size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: false
          cache-mode: off
          frozen-lockfile: true
      - name: Check the temporary native fixture
        run: |
          node --check scripts/e2e/freebsd-pkg-update-proof.mjs
          pnpm exec oxfmt --check scripts/e2e/freebsd-pkg-update-proof.mjs .github/workflows/freebsd-pkg-update-proof.yml
          node scripts/run-oxlint.mjs --tsconfig tsconfig.scripts.json scripts/e2e/freebsd-pkg-update-proof.mjs
      - name: Build and package once through the canonical producer
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/freebsd-pkg-payload"
          mkdir "$payload"
          curl --fail --silent --show-error --max-time 180 \
            https://registry.npmjs.org/openclaw/-/openclaw-2026.9.4.tgz \
            --output "$payload/openclaw-published.tgz"
          node scripts/package-openclaw-for-docker.mjs \
            --allow-unreleased-changelog --output-dir "$payload" \
            --output-name openclaw-candidate.tgz --pack-json "$payload/pack.json"
          node scripts/e2e/lib/update-first-hop-package-fixtures.mjs first-hop-tarball \
            "$payload/openclaw-candidate.tgz" "$payload/openclaw-first-hop.tgz" 0 \
            > "$payload/first-hop-fixture.json"
      - name: Bind exact source and package bytes
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node scripts/e2e/freebsd-pkg-update-proof.mjs stamp "$RUNNER_TEMP/freebsd-pkg-payload"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: freebsd-pkg-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/freebsd-pkg-payload/openclaw-candidate.tgz
            ${{ runner.temp }}/freebsd-pkg-payload/openclaw-first-hop.tgz
            ${{ runner.temp }}/freebsd-pkg-payload/openclaw-published.tgz
            ${{ runner.temp }}/freebsd-pkg-payload/pack.json
            ${{ runner.temp }}/freebsd-pkg-payload/first-hop-fixture.json
            ${{ runner.temp }}/freebsd-pkg-payload/source.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Record immutable artifact tuple
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: node scripts/e2e/freebsd-pkg-update-proof.mjs artifact

  native:
    name: Native FreeBSD pkg proof (${{ matrix.arch }})
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source-sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/e2e/freebsd-pkg-update-proof.mjs
            /scripts/lib/actions-artifact-archive.mjs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: proof-payload
          merge-multiple: true
      - name: Verify producer, attempt, artifact, and package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.package.outputs.source-sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_HEAD_SHA: ${{ needs.package.outputs.run-head-sha }}
          MANIFEST_SHA: ${{ needs.package.outputs.manifest-sha }}
          CANDIDATE_SHA: ${{ needs.package.outputs.candidate-sha }}
          FIRST_HOP_SHA: ${{ needs.package.outputs.first-hop-sha }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact-digest }}
          ARTIFACT_SIZE: ${{ needs.package.outputs.artifact-size }}
        run: node scripts/e2e/freebsd-pkg-update-proof.mjs verify-artifact proof-payload
      - name: Run the actual installed CLI with native pkg ownership
        id: vm
        uses: vmactions/freebsd-vm@112c19029bde758e5bb522eb1fa8a048ab580fb8
        with:
          release: "15.1"
          arch: ${{ matrix.arch }}
          mem: 6144
          cpu: 2
          data-dir: ${{ runner.temp }}/freebsd-pkg-vm
          sync: rsync
          copyback: false
          disable-cache: true
          cache-after-prepare: false
          debug-on-error: false
          prepare: |
            timeout -k 15s 300s sh -eu -c 'env ASSUME_ALWAYS_YES=yes pkg bootstrap -f; pkg install -y node24 npm-node24 python3 gmake'
          run: |
            timeout -k 15s 1200s /usr/local/bin/node scripts/e2e/freebsd-pkg-update-proof.mjs both proof-payload '${{ matrix.arch }}'
      - name: Shut down this disposable guest
        if: ${{ always() && steps.vm.outcome != 'skipped' }}
        run: node scripts/e2e/freebsd-pkg-update-proof.mjs shutdown "$RUNNER_TEMP/freebsd-pkg-vm"
